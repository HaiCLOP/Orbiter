[package]
name = "orbiter"
version = "0.1.0"
description = "Orbiter - 8D Spatial Audio Editor"
authors = ["Orbiter Contributors"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "orbiter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5.4", features = ["all"] }
thiserror = "2.0"
log = "0.4"
cpal = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54.0", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
] }


