[package]
name = "orbiter"
version = "0.1.0"
description = "Orbiter - 8D Spatial Audio Editor by HaiCLOP Labs"
authors = ["Arnav Srivastava <haiclop6@gmail.com> (HaiCLOP Labs)"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "orbiter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5.4", features = ["all"] }
thiserror = "2.0"
log = "0.4"
cpal = "0.15"
hound = "3.5"
mp3lame-encoder = "0.2.5"
uuid = { version = "1.10", features = ["v4"] }
sha2 = "0.10"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
ndarray = "0.17"
ort = "2.0.0-rc.14"
dirs = "6.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54.0", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }


